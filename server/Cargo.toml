[package]
name = "flick-server"
version = "0.1.0"
edition = "2021"
description = "Share media folders with Flick over HTTP"

[dependencies]
base64 = "0.22"
ctrlc = "3"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
kamadak-exif = "0.6"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
walkdir = "2"
include_dir = { version = "0.7", optional = true }

[features]
embed-web = ["dep:include_dir"]
