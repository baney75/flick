[package]
name = "flick"
version = "0.1.0"
description = "Flick media player"
edition = "2021"

[lib]
name = "flick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
base64 = "0.23"
# Kodi JSON-RPC, and downloads from Plex and Jellyfin, which are often https (plex.direct).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# Free space in the downloads folder.
fs4 = "1"
percent-encoding = "2"
# Shares this library with the person's other devices; embed-web serves them the Flick app too.
flick-server = { path = "../server", features = ["embed-web"] }
if-addrs = "0.15"
# The VPN gate's exit check (src/vpn.rs): TLS to Cloudflare's trace page from a socket bound to one
# interface. Same rustls and ring build ureq already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
socket2 = { version = "0.6", features = ["all"] }
# Checks the yt-dlp release binary against its published SHA2-256SUMS.
sha2 = "0.10"
getrandom = "0.3"

# Self-update from GitHub Releases, desktop only: phones update through their stores.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The token-guarded 127.0.0.1 server the player reads a torrent from (src/torrent_http.rs).
tiny_http = "0.12"
# Plays torrent streams from source plugins (src/torrent.rs): rustls, not OpenSSL. Its UPnP code
# maps a port only for a listener, and the engine never listens. Exact pin; its tree is pinned in
# Cargo.lock.
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
codegen-units = 1
opt-level = 3
# Xcode 27's strip corrupts Rust proc-macro dylibs ("mis-aligned LINKEDIT"), so never strip host build code.
[profile.release.build-override]
strip = "none"
debug = false

# librqbit-utp 0.7.0 needs ringbuf 0.4, which has RUSTSEC-2026-0293. Upstream's fix is merged but
# not released: it changes only the ringbuf version and skips one Windows receive error. Pinned
# to that commit until a release carries it.
[patch.crates-io]
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp", rev = "06e1c53c8df6edb2830d6aab64a6d4bed8479908" }
