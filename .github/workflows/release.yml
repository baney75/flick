name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # The update feed announces the app version, so a tag that differs from it would ship a release no
  # copy of Flick ever offers.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version src-tauri/tauri.conf.json)"
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: '--target universal-apple-darwin' }
          - { os: windows-latest, args: '' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. The public key is plugins.updater.pubkey in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Flick ${{ github.ref_name }}
          # Each desktop job adds its files and its platforms in latest.json to one draft; the publish job
          # makes it public once all three succeed, so the update feed never points at half a release.
          releaseDraft: true
          includeUpdaterJson: true
          # Updater files only in CI: a local build has no signing key.
          args: ${{ matrix.args }} --config {"bundle":{"createUpdaterArtifacts":true}}
      - uses: actions/upload-artifact@v4
        with:
          name: flick-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
  # The one update channel is the latest published release: no drafts, no prereleases.
  publish:
    needs: desktop
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK packages (the runner ships the SDK; setup-android@v3 fails on the retired tools package)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' }
      - run: npm ci
      - name: Build APK (phones, tablets and Android TV)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npx tauri android init --ci
          node scripts/android-tv.mjs
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: flick-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios-sim' }
      - run: npm ci
      - name: Build for the iOS simulator (device builds need an Apple developer team)
        run: |
          npx tauri ios init --ci
          npx tauri ios build --target aarch64-sim --ci || npx tauri ios build --target aarch64-sim
