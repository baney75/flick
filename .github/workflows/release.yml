name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # One draft for the three desktop jobs, made before they start so they cannot race to create two.
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      # latest.json announces the app version, and every user is on the one channel: a tag must be a
      # stable version equal to the app's.
      - if: github.ref_type == 'tag'
        run: |
          case "$GITHUB_REF_NAME" in *-*) echo "No prerelease tags: they would reach every user."; exit 1;; esac
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .version src-tauri/tauri.conf.json)"
      - id: draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A rerun reuses its draft. A new draft's id comes from the create call, since a list made
          # right after it may not show it yet.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .tag_name == env.GITHUB_REF_NAME) | .id' | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Flick $GITHUB_REF_NAME" -f body="" -F draft=true --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
  # The same checks as every pull request, src-tauri's tests included: no build starts until they pass.
  tests:
    uses: ./.github/workflows/check.yml
  desktop:
    needs: [release, tests]
    strategy:
      fail-fast: false
      # One at a time: each job rewrites latest.json on the draft, and two at once can drop a platform.
      max-parallel: 1
      matrix:
        include:
          - { os: macos-latest, args: '--target universal-apple-darwin' }
          - { os: windows-latest, args: '' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: npm ci
      # Update files only in CI: a local build has no signing key.
      - shell: bash
        run: node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. The public key is plugins.updater.pubkey in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on a manual run: build only, no release.
          releaseId: ${{ needs.release.outputs.id }}
          # With the tag, latest.json links to /releases/download/<tag>/, not a draft's untagged-* path.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: flick-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
  # The one update channel is the latest published release. It goes public only after all three desktop
  # jobs succeed and latest.json, which they merge in turn, lists every platform.
  publish:
    needs: [release, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.release.outputs.id }}
    steps:
      - run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[] | select(.name == "latest.json") | .url')
          gh api -H 'Accept: application/octet-stream' "$url" > latest.json
          jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64") and has("linux-x86_64")' latest.json
          # Every download link must point at this release, or users get a 404 or another release's file.
          jq -e --arg t "$GITHUB_REF_NAME" '[.platforms[].url | contains("/releases/download/" + $t + "/")] | all' latest.json
      - run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=false -f make_latest=true
  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK packages (the runner ships the SDK; setup-android@v3 fails on the retired tools package)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' }
      - run: npm ci
      - name: Build APK (phones, tablets and Android TV)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npx tauri android init --ci
          node scripts/android-tv.mjs
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: flick-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  ios:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios-sim' }
      - run: npm ci
      - name: Build for the iOS simulator (device builds need an Apple developer team)
        run: |
          npx tauri ios init --ci
          npx tauri ios build --target aarch64-sim --ci || npx tauri ios build --target aarch64-sim
