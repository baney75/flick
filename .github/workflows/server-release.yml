name: server-release
# A server-v* tag builds flick-server for each platform, attaches the archives to that tag's release and
# pushes ghcr.io/baney75/flick-server. A manual run only builds the archives and keeps them as run artifacts.
on:
  push:
    tags: ['server-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.ref_type == 'tag'
        name: Tag matches server/Cargo.toml
        run: |
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME#server-v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $want"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: web-dist, path: dist, if-no-files-found: error }
  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: web-dist, path: dist }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { targets: '${{ matrix.target }}' }
      - run: cargo build --release --locked --features embed-web --target ${{ matrix.target }} --manifest-path server/Cargo.toml
      - name: Archive
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#server-v}; else v=dev-${GITHUB_SHA::7}; fi
          name=flick-server-$v-${{ matrix.target }}
          mkdir -p "out/$name"
          cp server/README.md server/CONTRACT.md "out/$name/"
          cd out
          if [ "$RUNNER_OS" = Windows ]; then
            cp ../server/target/${{ matrix.target }}/release/flick-server.exe "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp ../server/target/${{ matrix.target }}/release/flick-server "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'server-${{ matrix.target }}', path: out/*, if-no-files-found: error }
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'server-*', path: out, merge-multiple: true }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" --verify-tag --title "flick-server ${tag#server-v}" --notes "See server/README.md to install."
          gh release upload "$tag" out/* --clobber
  image:
    if: github.ref_type == 'tag'
    # The image is pushed only once every platform's binary has built.
    needs: [web, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/baney75/flick-server:${{ steps.v.outputs.version }}
            ghcr.io/baney75/flick-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
