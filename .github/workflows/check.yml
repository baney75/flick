name: check
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same checks before it builds anything.
  workflow_call:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit && npx vitest run && npx vite build
      - run: SMOKE_CHANNEL=chromium node scripts/smoke.mjs
      - name: Sync relay and two-device sync
        run: node relay/test.mjs && SMOKE_CHANNEL=chromium node scripts/sync-e2e.mjs
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # ffmpeg for the playback tests, which fail rather than skip in CI when it is missing.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - run: mkdir -p dist && cd src-tauri && cargo clippy -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=4
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml
      - name: embed-web builds (stub dist)
        run: |
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>stub' > dist/index.html
          cargo clippy --manifest-path server/Cargo.toml --features embed-web --all-targets -- -D warnings
