name: check
on:
  push:
    branches: [main]
  pull_request:
  # release.yml and server-release.yml run these same checks before they build anything.
  workflow_call:
# The checks only read, also when a release calls them with its write token.
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx tsc --noEmit && npx vitest run && npx vite build
      - run: SMOKE_CHANNEL=chromium node scripts/smoke.mjs
      # Plugin code runs in a Worker: in WebKit, the apps' engine, a busy plugin used to freeze Flick.
      - name: Plugin Worker, Chromium and WebKit
        run: SMOKE_CHANNEL=chromium node scripts/plugin-worker-check.mjs && node scripts/plugin-worker-check.mjs --engine webkit
      - name: Sync relay and two-device sync
        run: node relay/test.mjs && SMOKE_CHANNEL=chromium node scripts/sync-e2e.mjs
      # Speed in WebKit, the apps' engine. A runner is too slow for perf/budgets.json itself (those are for
      # a desktop), so a pull request is measured against its base, built and run on this runner first,
      # and fails on a clear regression (regressions() in scripts/perf-lib.mjs). Budget misses are listed.
      - name: Speed against the base branch (WebKit)
        if: github.event_name == 'pull_request'
        env: { BASE: '${{ github.event.pull_request.base.sha }}' }
        run: |
          git fetch -q --no-tags --depth=1 origin "$BASE"
          git worktree add -q --detach "$RUNNER_TEMP/base" FETCH_HEAD
          if git diff --quiet FETCH_HEAD HEAD -- package-lock.json; then ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"; else (cd "$RUNNER_TEMP/base" && npm ci); fi
          (cd "$RUNNER_TEMP/base" && npx vite build --logLevel warn --outDir "$RUNNER_TEMP/base-dist")
          node scripts/perf.mjs --viewport 1280 --no-build --dist "$RUNNER_TEMP/base-dist" --no-gate --out perf/results-base.json
          npm run perf -- --viewport 1280 --no-build --against perf/results-base.json --compare perf/results-base.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with: { name: perf-results, path: perf/results*.json, if-no-files-found: ignore }
  rust:
    # 24.04 for its ffmpeg (6.1): the playback tests run against it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # ffmpeg for the playback tests, which fail rather than skip in CI when it is missing.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - run: mkdir -p dist && cd src-tauri && cargo clippy -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=4
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml
      - name: embed-web builds (stub dist)
        run: |
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>stub' > dist/index.html
          cargo clippy --manifest-path server/Cargo.toml --features embed-web --all-targets -- -D warnings
