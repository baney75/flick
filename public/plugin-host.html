<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- One source plugin runs here, in an iframe with sandbox="allow-scripts" and no allow-same-origin,
     so its origin is opaque: no access to Flick's storage, cookies, page or other plugins.
     Plugin code arrives over postMessage and loads as a blob: (or data:) module inside a blob: Worker. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: data:; connect-src *; img-src * data: blob:; media-src * blob:; base-uri 'none'; form-action 'none'">
<title>Flick plugin</title>
</head>
<body>
<script src="/plugin-host.js"></script>
</body>
</html>
